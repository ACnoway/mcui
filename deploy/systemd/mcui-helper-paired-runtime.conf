[Unit]
Requires=mcui-runtime-recover.service
After=mcui-runtime-recover.service

[Service]
Type=notify
NotifyAccess=main
TimeoutStartSec=35s
Environment=MCUI_RUNTIME_TRIAL_FILE=/var/lib/mcui-runtime/trial
ExecStart=
ExecStart=/var/lib/mcui-runtime/current/mcui-helper -node-id ${MCUI_NODE_ID} -master ${MCUI_MASTER_URL} -master-ca=${MCUI_SERVER_CA} -task-key-id ${MCUI_TASK_KEY_ID} -task-public-key /etc/mcui-agent/task-signing.pub -agent-user mcui-agent -socket-group mcui-agent -state-dir /var/lib/mcui-helper -socket /run/mcui/helper.sock
