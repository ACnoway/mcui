[Unit]
Wants=mcui-helper.service
After=mcui-helper.service

[Service]
EnvironmentFile=/etc/mcui-agent/agent-task-runtime.env
ExecStart=
ExecStart=/usr/local/bin/mcui-agent -master ${MCUI_MASTER_URL} -node-id ${MCUI_NODE_ID} -server-ca=${MCUI_SERVER_CA} -task-key-id ${MCUI_TASK_KEY_ID} -task-public-key /etc/mcui-agent/task-signing.pub -task-ledger /var/lib/mcui-agent/tasks.db -helper-socket /run/mcui/helper.sock
