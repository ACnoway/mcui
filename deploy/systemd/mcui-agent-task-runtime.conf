[Unit]
Wants=mcui-helper.service
After=mcui-helper.service

[Service]
EnvironmentFile=/etc/mcui-agent/agent-task-runtime.env
ExecStart=
ExecStart=/usr/local/bin/mcui-agent -master ${MCUI_MASTER_URL} -name ${MCUI_AGENT_NAME} -group ${MCUI_AGENT_GROUP} -server-ca ${MCUI_SERVER_CA} -invite-file ${MCUI_INVITE_FILE} -task-key-id ${MCUI_TASK_KEY_ID} -task-public-key /etc/mcui-agent/task-signing.pub -task-ledger /var/lib/mcui-agent/tasks.db -helper-socket /run/mcui/helper.sock
