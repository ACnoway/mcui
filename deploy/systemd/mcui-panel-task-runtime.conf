[Unit]
Wants=mcui-signerd.service
After=mcui-signerd.service

[Service]
SupplementaryGroups=mcui-task
EnvironmentFile=/etc/mcui/panel-task-runtime.env
ExecStart=
ReadOnlyPaths=/etc/mcui-task-signer
ExecStart=/usr/local/bin/mcui-panel -listen 0.0.0.0:8443 -db /var/lib/mcui/mcui.db -web /opt/mcui/web/dist -tls-cert /etc/mcui/master-chain.pem -tls-key /etc/mcui/master-key.pem -task-db /var/lib/mcui/tasks.db -task-key-id ${MCUI_TASK_KEY_ID} -task-public-key /etc/mcui/task-signing.pub -task-signer-url http://127.0.0.1:9231 -task-signer-token-file /etc/mcui-task-signer/token
