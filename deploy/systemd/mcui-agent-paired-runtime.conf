[Unit]
Requires=mcui-runtime-recover.service
After=mcui-runtime-recover.service mcui-helper.service

[Service]
Type=notify
NotifyAccess=main
TimeoutStartSec=35s
Environment=MCUI_RUNTIME_TRIAL_FILE=/var/lib/mcui-runtime/trial
ExecStart=
ExecStart=/var/lib/mcui-runtime/current/mcui-agent -master ${MCUI_MASTER_URL} -node-id ${MCUI_NODE_ID} -server-ca=${MCUI_SERVER_CA} -task-key-id ${MCUI_TASK_KEY_ID} -task-public-key /etc/mcui-agent/task-signing.pub -task-ledger /var/lib/mcui-agent/tasks.db -helper-socket /run/mcui/helper.sock
