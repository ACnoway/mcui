services:
  master:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      MCUI_LISTEN: 127.0.0.1:8080
      MCUI_PUBLIC_URL: https://${MCUI_DOMAIN:?Set MCUI_DOMAIN to the public panel hostname}
      MCUI_HTTPS_PROXY_PEER: 127.0.0.1

  https:
    image: caddy:2
    network_mode: service:master
    depends_on:
      master:
        restart: true
    command:
      - caddy
      - reverse-proxy
      - --from
      - https://${MCUI_DOMAIN:?Set MCUI_DOMAIN to the public panel hostname}
      - --to
      - http://127.0.0.1:8080
    volumes:
      - https-data:/data
    restart: unless-stopped

volumes:
  https-data:
