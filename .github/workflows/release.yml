name: Publish MCUI release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable, alpha or beta Git tag
        required: true
        type: string

concurrency:
  group: mcui-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  binaries:
    if: >-
      github.repository == 'ACnoway/mcui' &&
      ((github.event_name == 'push' && github.event.created) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      deployment_ready: ${{ steps.publish.outputs.deployment_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          channel=$(bash scripts/release-channel.sh "$RELEASE_TAG")
          printf 'tag=%s\nchannel=%s\ncommit=%s\n' \
            "$RELEASE_TAG" "$channel" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c4 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check and build Linux binaries
        run: |
          set -euo pipefail
          npm install --global pnpm@12.17.0
          bash scripts/check-static.sh
          bash scripts/build-binary-release.sh "$RUNNER_TEMP/mcui-binaries"
          cd "$RUNNER_TEMP/mcui-binaries"
          sha256sum --check SHA256SUMS-binaries

      - name: Publish preview or stage stable release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          HAS_RELEASE_PUBLIC_KEY: ${{ vars.MCUI_RELEASE_PUBLIC_KEY != '' }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/mcui-binaries"
          preview=false
          draft_options=(--draft --latest=false)
          if [[ "$RELEASE_CHANNEL" != stable ]]; then
            preview=true
            draft_options+=(--prerelease)
          fi
          release_view=(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,assets)
          if ! release=$("${release_view[@]}" 2>/dev/null); then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes "${draft_options[@]}"
            release=$("${release_view[@]}")
          fi
          jq -e --arg tag "$RELEASE_TAG" --argjson preview "$preview" \
            '.tagName == $tag and .isPrerelease == $preview' <<< "$release" >/dev/null
          if ! jq -e '.isDraft' <<< "$release" >/dev/null; then
            echo "Release $RELEASE_TAG is already published."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$assets"/mcui-master-linux-*.tar.gz "$assets"/mcui-agent-linux-*.zip "$assets/SHA256SUMS-binaries"
          if [[ "$preview" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --prerelease --latest=false
          elif [[ "$HAS_RELEASE_PUBLIC_KEY" == true ]] &&
            "${release_view[@]}" | jq -e '[.assets[].name] | index("manifest.json") != null and index("manifest.json.sig") != null' >/dev/null; then
            echo 'deployment_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo "Stable draft $RELEASE_TAG has the binaries. Add the signed manifest and configure MCUI_RELEASE_PUBLIC_KEY to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  deployment:
    needs: binaries
    if: needs.binaries.outputs.deployment_ready == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-deployment.yml
    with:
      tag: ${{ needs.binaries.outputs.tag }}
      commit: ${{ needs.binaries.outputs.commit }}
