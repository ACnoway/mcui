name: Publish MCUI deployment

on:
  workflow_call:
    inputs:
      tag:
        description: Draft stable or preview Release tag
        required: true
        type: string
      commit:
        description: Commit checked out by the binary release job
        required: true
        type: string

concurrency:
  group: publish-mcui-deployment
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  IMAGE: ghcr.io/acnoway/mcui-master

jobs:
  publish:
    if: github.repository == 'ACnoway/mcui'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    outputs:
      channel: ${{ steps.channel.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Identify release channel
        id: channel
        run: |
          channel=$(bash scripts/release-channel.sh "$RELEASE_TAG")
          printf 'value=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Check matching draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=$(bash scripts/release-channel.sh "$RELEASE_TAG")
          preview=false
          [[ "$channel" == stable ]] || preview=true
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName |
            jq -e --arg tag "$RELEASE_TAG" --argjson preview "$preview" \
              '.isDraft and .isPrerelease == $preview and .tagName == $tag'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Build deployment assets
        run: |
          set -euo pipefail
          npm install --global pnpm@12.17.0
          bash scripts/build-compose-release.sh "$RUNNER_TEMP/mcui-release" "$RELEASE_TAG"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Push versioned Master image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$IMAGE:$RELEASE_TAG" --file deploy/master/Dockerfile "$RUNNER_TEMP/mcui-release/image"

      - name: Publish GitHub Release with installers and Compose files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.value }}
        working-directory: ${{ runner.temp }}/mcui-release
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            install-mcui-agent.sh install-mcui-master.sh compose.yaml compose.https.yaml SHA256SUMS
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --prerelease --latest=false
          fi

  promote-image:
    needs: publish
    if: needs.publish.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Update default image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
